backend:
  name: github
  repo: mises-a-jour/synoptique-site
  branch: main
  base_url: https://sveltia-cms-auth.mises-a-jour.workers.dev

# Sveltia dépose les images téléversées ici, et le site y fait référence avec ce préfixe.
media_folder: "src/assets/img/uploads"
public_folder: "/assets/img/uploads"

locale: fr

collections:
  - name: livres
    label: "Livres"
    label_singular: "Livre"
    folder: "src/livres"
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: yaml-frontmatter
    identifier_field: titre
    summary: "{{titre}} — {{auteurNom}}"
    fields:
      - { label: "Titre", name: titre, widget: string }
      - { label: "Identifiant d'URL (slug)", name: slug, widget: string, hint: "Sans accents ni espaces, ex. theophile" }
      - { label: "Auteur (identifiant)", name: auteur, widget: string, hint: "Doit correspondre au slug de la fiche auteur, ex. marcel-de-corte" }
      - { label: "Nom de l'auteur (affiché)", name: auteurNom, widget: string }
      - { label: "Année de parution", name: annee, widget: number, value_type: int }
      - { label: "Nombre de pages", name: pages, widget: number, value_type: int }
      - label: "Genre"
        name: genre
        widget: select
        options: ["Aphorismes", "Essais", "Philosophie", "Poésie"]
      - { label: "Collection", name: collection, widget: string, required: false, hint: "Ex. Marcel De Corte — laisser vide si aucune" }
      - label: "Maison"
        name: maison
        widget: select
        options:
          - { label: "Éditions Synoptique", value: "synoptique" }
          - { label: "Les Presses Philosophiques", value: "presses" }
      - { label: "Prix (CAD)", name: prixCAD, widget: number }
      - { label: "Prix (EUR)", name: prixEUR, widget: number }
      - { label: "ISBN", name: isbn, widget: string, required: false }
      - { label: "Préface (mention)", name: preface, widget: string, required: false, hint: "Ex. Préface de Jean Renaud" }
      - { label: "Couverture", name: cover, widget: image, media_folder: "src/assets/covers", public_folder: "/assets/covers", hint: "1000 px de haut, ~650 px de large" }
      - { label: "Poids (grammes, pour l'expédition)", name: poids, widget: number, required: false }
      - { label: "Nouveauté ?", name: nouveaute, widget: boolean, default: false, required: false }
      - label: "Fichier audio de l'entretien"
        name: audio
        widget: file
        media_folder: "src/assets/audio"
        public_folder: "/assets/audio"
        required: false
      - { label: "Crédit de l'entretien", name: audioCredit, widget: text, required: false }
      - label: "Ce qu'on en dit (revue de presse)"
        name: says
        widget: list
        required: false
        fields:
          - { label: "Référence complète (auteur, titre, revue, date)", name: source, widget: string }
          - { label: "Lien (optionnel)", name: url, widget: string, required: false }
          - { label: "Texte cité", name: texte, widget: text, required: false }
      - { label: "Description (corps de la fiche)", name: body, widget: markdown }

  - name: auteurs
    label: "Auteurs"
    label_singular: "Auteur"
    folder: "src/auteurs"
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: yaml-frontmatter
    identifier_field: nom
    fields:
      - { label: "Titre (identique au nom, en général)", name: titre, widget: string }
      - { label: "Nom complet", name: nom, widget: string }
      - { label: "Identifiant d'URL (slug)", name: slug, widget: string }
      - { label: "Tri (patronyme, pour le classement alphabétique)", name: tri, widget: string, hint: "Ex. « Corte » pour Marcel De Corte" }
      - { label: "Dates (naissance-décès)", name: dates, widget: string, required: false, hint: "Ex. 1905-1994" }
      - { label: "Initiales (portrait de secours si pas de photo)", name: ini, widget: string, required: false }
      - { label: "Photo", name: photo, widget: image, media_folder: "src/assets/img", public_folder: "/assets/img", required: false }
      - { label: "Notice biographique", name: body, widget: markdown, required: false }

  - name: agenda
    label: "Agenda"
    files:
      - name: evenements
        label: "Événements"
        file: "src/_data/evenements.json"
        fields:
          - label: "Événements"
            name: events
            widget: list
            root: true
            fields:
              - { label: "Titre de l'événement", name: titre, widget: string }
              - label: "Type"
                name: type
                widget: select
                options: ["Lancement", "Signature", "Salon", "Conférence"]
              - { label: "Date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "Date affichée (optionnel)", name: dateLisible, widget: string, required: false, hint: "Ex. 8 octobre 2025 — sinon formatée automatiquement" }
              - { label: "Heure", name: heure, widget: string, required: false, hint: "Ex. 17 h 30" }
              - { label: "Lieu", name: lieu, widget: string, required: false }
              - { label: "Adresse", name: adresse, widget: string, required: false }
              - { label: "Auteur concerné", name: auteur, widget: string, required: false }
              - { label: "Description", name: description, widget: text, required: false }
              - { label: "Note (avis pratique, restrictions, etc.)", name: note, widget: text, required: false }

  - name: pages
    label: "Pages du site"
    files:
      - name: accueil
        label: "Page d'accueil"
        file: "src/_data/pages.json"
        fields:
          - label: "Page d'accueil"
            name: accueil
            widget: object
            fields:
              - { label: "Titre — première partie (en noir)", name: titre_ligne1, widget: string }
              - { label: "Titre — deuxième partie (en rouge, italique)", name: titre_ligne2, widget: string }
              - { label: "Lettrine", name: intro_lettrine, widget: string, hint: "Une seule lettre, affichée en gros et en rouge au début du paragraphe" }
              - { label: "Paragraphe d'introduction", name: intro, widget: text, hint: "ATTENTION : commence à la DEUXIÈME lettre du texte — la première est la lettrine ci-dessus" }
              - { label: "Texte du bouton", name: bouton_texte, widget: string }
              - { label: "Titre — section Nouveautés", name: titre_nouveautes, widget: string }
              - { label: "Lien — section Nouveautés", name: lien_nouveautes, widget: string }
              - { label: "Titre — section Catalogue", name: titre_catalogue, widget: string }
              - { label: "Lien — section Catalogue", name: lien_catalogue, widget: string }
          - { label: "La Maison", name: maison, widget: object, collapsed: true, fields: [
              { label: "Titre de la page", name: titre, widget: string },
              { label: "Citation en exergue", name: exergue_texte, widget: text },
              { label: "Source de la citation", name: exergue_source, widget: string },
              { label: "Titre du bandeau — 1re ligne", name: propos_titre_ligne1, widget: string },
              { label: "Titre du bandeau — 2e ligne", name: propos_titre_ligne2, widget: string },
              { label: "Texte du bandeau", name: propos_texte, widget: text, hint: "Chaque paragraphe doit être entouré de <p> et </p>. Pour l'italique : <em>mot</em>" },
              { label: "Devise sous le logo", name: lockup_tagline, widget: string },
              { label: "Texte « Synoptique »", name: synoptique_texte, widget: text, hint: "Chaque paragraphe entouré de <p> et </p>" },
              { label: "Titre — Collections", name: collections_titre, widget: string },
              { label: "Texte — Collections", name: collections_texte, widget: text, hint: "Entouré de <p> et </p>" },
              { label: "Lien — Collections", name: collections_lien, widget: string },
              { label: "Titre — Maison affiliée", name: affiliee_titre, widget: string },
              { label: "Texte — Maison affiliée", name: affiliee_texte, widget: text, hint: "Entouré de <p> et </p>" },
              { label: "Lien — Maison affiliée", name: affiliee_lien, widget: string },
              { label: "Titre — Nous joindre", name: joindre_titre, widget: string },
              { label: "Texte — Nous joindre", name: joindre_texte, widget: text, hint: "Entouré de <p> et </p>" }
            ] }
          - { label: "Nous écrire", name: nous_ecrire, widget: object, collapsed: true, fields: [
              { label: "Titre de la page", name: titre, widget: string },
              { label: "Phrase d'introduction", name: intro, widget: string },
              { label: "Étiquette du formulaire", name: formulaire_label, widget: string },
              { label: "Note sous le formulaire", name: formulaire_note, widget: text },
              { label: "Mention « formulaire à venir »", name: formulaire_placeholder, widget: string },
              { label: "Étiquette du courriel", name: courriel_label, widget: string },
              { label: "Adresse courriel", name: courriel_adresse, widget: string }
            ] }
          - { label: "Catalogue", name: catalogue, widget: object, collapsed: true, fields: [
              { label: "Titre de la page", name: titre, widget: string },
              { label: "Phrase d'introduction", name: intro_suite, widget: text, hint: "Le nombre de titres est ajouté automatiquement au début" }
            ] }
          - { label: "Auteurs", name: auteurs, widget: object, collapsed: true, fields: [
              { label: "Titre de la page", name: titre, widget: string },
              { label: "Phrase d'introduction", name: intro, widget: string }
            ] }
          - { label: "Nouveautés", name: nouveautes, widget: object, collapsed: true, fields: [
              { label: "Titre de la page", name: titre, widget: string },
              { label: "Phrase d'introduction", name: intro, widget: string }
            ] }
          - { label: "Agenda", name: agenda, widget: object, collapsed: true, fields: [
              { label: "Titre de la page", name: titre, widget: string },
              { label: "Phrase d'introduction", name: intro, widget: string },
              { label: "Titre — Événements à venir", name: titre_avenir, widget: string },
              { label: "Titre — Événements passés", name: titre_passes, widget: string },
              { label: "Message si aucun événement à venir", name: vide_avenir, widget: string },
              { label: "Message si aucun événement passé", name: vide_passes, widget: string }
            ] }
          - { label: "Panier", name: panier, widget: object, collapsed: true, fields: [
              { label: "Titre de la page", name: titre, widget: string },
              { label: "Phrase d'introduction", name: intro, widget: string },
              { label: "Texte principal", name: texte, widget: text },
              { label: "Mention « à venir »", name: placeholder, widget: string }
            ] }
          - { label: "Les Presses Philosophiques", name: presses, widget: object, collapsed: true, fields: [
              { label: "Titre de la page", name: titre, widget: string },
              { label: "Phrase d'introduction", name: intro, widget: text }
            ] }
          - { label: "Collection Marcel De Corte", name: collection_de_corte, widget: object, collapsed: true, fields: [
              { label: "Titre de la page", name: titre, widget: string },
              { label: "Phrase d'introduction", name: intro, widget: string }
            ] }
          - { label: "Pages de genres", name: genres, widget: object, collapsed: true, fields: [
              { label: "Aphorismes — introduction", name: aphorismes_intro, widget: string },
              { label: "Essais — introduction", name: essais_intro, widget: string },
              { label: "Philosophie — introduction", name: philosophie_intro, widget: string },
              { label: "Poésie — introduction", name: poesie_intro, widget: string }
            ] }
