<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditions Synoptique</title>
<meta name="robots" content="noindex">
<style>
  /* Tout est ici : cette page doit s'afficher même quand le reste du site est coupé. */
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background-color: #f4efe3;
    background-image:
      radial-gradient(circle at 18% -10%, #fbf7ee 0%, transparent 55%),
      radial-gradient(circle at 100% 0%, #efe7d7 0%, transparent 42%);
    color: #1f1c17;
    font-family: "EB Garamond", Garamond, Georgia, "Times New Roman", serif;
    line-height: 1.62;
    padding: 2rem;
  }
  .bloc { max-width: 34rem; text-align: center; }
  .marque {
    font-size: 1.55rem; font-weight: 600;
    letter-spacing: .18em; text-transform: uppercase;
    margin: 0 0 .4rem;
  }
  .devise {
    font-variant: small-caps; text-transform: lowercase;
    letter-spacing: .22em; font-size: .78rem; color: #6f675a;
    margin: 0 0 2.6rem;
  }
  .filet { border: 0; border-top: 1px solid #c9c0ac; margin: 0 auto 2.6rem; width: 4rem; }
  h1 {
    font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 500;
    line-height: 1.2; margin: 0 0 1.1rem;
  }
  h1 em { font-style: italic; color: #8f2d20; }
  p { color: #423c33; margin: 0 0 1rem; font-size: 1.05rem; }
  .discret { color: #6f675a; font-size: .92rem; font-style: italic; margin-top: 2rem; }
</style>
</head>
<body>
  <div class="bloc">
    <p class="marque">Synoptique</p>
    <p class="devise">Œuvres de lumière, voisines du silence</p>
    <hr class="filet">
    <h1>Le site est momentanément <em>fermé</em></h1>
    <p>Nous procédons à une interruption temporaire. Le catalogue et les pages
      de la maison seront de nouveau accessibles sous peu.</p>
    <p class="discret">Merci de votre patience.</p>
  </div>
</body>
</html>
