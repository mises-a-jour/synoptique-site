name: Construire et déployer le site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Installer Python (pour les scripts de post-traitement)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construire le site
        run: bash build.sh

      - name: Déposer sur LIKUID par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LIKUID_FTP_HOST }}
          username: ${{ secrets.LIKUID_FTP_USER }}
          password: ${{ secrets.LIKUID_FTP_PASSWORD }}
          local-dir: ./_site/
          server-dir: ./
